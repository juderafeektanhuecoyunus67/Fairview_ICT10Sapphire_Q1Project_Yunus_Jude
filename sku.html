<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU generator (Project)</title>
   <!-- PyScript release CSS and JS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <!-- Custom stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar-custom">
        <div style="display: flex;">
            <a href="sku.html" class="nav-box">║▌ SKU generator</a>
            <a href="index.html" class="nav-box">🏷️ Receipt generator</a>
            
        </div>
        <div class="title-area">
            <button class="go-btn">The Skewer....</button>
        </div>
    </header>

   

   <!-- Main Content Body -->
  <main>
    <div class="card">
      
      <!-- Card Header Banner -->
      <div class="card-header">
        <div style="font-size: 1.5rem;">|||||</div>
        <h2>SKU Generator</h2>
      </div>
      
      <!-- Card Body Content -->
      <div class="card-body">
        
        <!-- Category Selection -->
        <div class="form-group">
          <label for="category">🏷️ Category:</label>
          <select id="category">
            <option value="Perishables">Perishables</option>
            <option value="Beverages">Beverages</option>
            <option value="Supplies">Supplies</option>
          </select>
        </div>

        <!-- Product Name Input -->
        <div class="form-group">
          <label for="productName">🛒 Product Name:</label>
          <input type="text" id="productName" placeholder="e.g. Bottled Water">
        </div>

        <!-- Stock Quantity Input -->
        <div class="form-group">
          <label for="stockQuantity">📠 Stock Quantity:</label>
          <input type="number" id="stockQuantity" placeholder="e.g. 50">
        </div>

        <!-- Submit Button -->
        <button class="btn-primary" onclick="generateSKU()">Generate SKU</button>

        <!-- Output Display Box -->
        <div class="output-box" id="skuResult">
          Your generated SKU will appear here.
        </div>

      </div>
    </div>
  </main>

  <!-- Page Footer -->
  <footer>
    &lt;/&gt; SKU Generator — 1st Quarter Project
  </footer>

  <!-- External Script -->
  <script src="main.js"></script>
</body>
</html>
    
</body>
</html>
