<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt generator (Skills Test) </title>
   <!-- PyScript -> CSS and JS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <!-- Actual CSS -->

<body>
    <header class="navbar-custom">
        <div style="display: flex;">
            <a href="sku.html" class="nav-box">║▌ SKU generator</a>

        </div>

        <!-- The Action Button -->
        <button type="submit" py-click="generate_order">Create order</button>

        <!-- The Receipt Section -->
        <div class="receipt-section">
            <h3><b>Receipt....</b></h3>
            <div id="output1">
                <p>Subtotal: </p>
                <p>Tax: </p>
                <p><b>Sum/Total:</b> </p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        Jude T. Yunus | 10-Sapphire ©2026
    </footer>

    <!-- PyScript link -->
    <script type="py" src="main.py"></script>
